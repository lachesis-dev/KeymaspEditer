// 利便性を考えて、デフォルトではなくhttps://jurf.github.io/2023/07/11/60-percent-miryoku/ベース　Mityoku（QWERTY）配列

#include <behaviors.dtsi>
#include <dt-bindings/zmk/keys.h>
#include <dt-bindings/zmk/bt.h>
#include <dt-bindings/zmk/outputs.h>
#include <dt-bindings/zmk/mouse.h>
#include <behaviors/rgbled_widget.dtsi>

&mt {
    quick-tap-ms = <175>;
    require-prior-idle-ms = <125>;
    flavor = "tap-preferred";
    tapping-term-ms = <300>;
};

/ {
    combos {
        compatible = "zmk,combos";

        combo_esc {
            timeout-ms = <50>;
            key-positions = <0 1>;
            bindings = <&kp ESC>;
        };

        back {
            bindings = <&kp DEL>;
            key-positions = <8 9>;
            layers = <0 1 2 6>;
        };
        
        ZenHan {
            bindings = <&kp LANG_ZENKAKUHANKAKU>;
            key-positions = <12 13>;
        };
    };

    keymap {
        compatible = "zmk,keymap";

        // ─────────────────────────────
        // BASE（jurf 60% Miryoku　Base）
        // ─────────────────────────────
        base_layer {

            display-name = "BASE";

            bindings = <
            &kp Q           &kp W           &kp E           &kp R             &kp T             &kp Y       &kp U               &kp I            &kp O            &kp P
            &mt LEFT_GUI A  &mt LEFT_ALT S  &mt LCTRL D     &mt LEFT_SHIFT F  &kp G             &kp H       &mt RIGHT_SHIFT J   &mt RCTRL K      &mt RIGHT_ALT L  &kp FSLH
&mo 5       &kp Z           &kp X           &kp C           &kp V             &kp B             &kp N       &kp M               &kp COMMA        &kp DOT          &kp FSLH         &kp FSLH
                                            &lt 1 SPACE     &lt 3 RET         &lt 6 BACKSPACE    &lt 2 SPACE    &kp ENTER          &kp BACKSPACE
            >;
        };

        // ─────────────────────────────
        // NAVI
        // ─────────────────────────────
        nav_layer {

            display-name = "NAVI";

            bindings = <
        &kp ESC    &trans     &trans    &kp EQUAL  &kp LBRC    &kp RBRC  &kp KP_N7  &kp KP_N8  &kp KP_N9  &kp KP_PLUS
        &kp LSHFT  &trans     &trans    &trans     &kp LBKT    &kp RBKT  &kp KP_N4  &kp KP_N5  &kp KP_N6  &kp KP_MINUS
&trans  &kp DEL    &kp PG_UP  &kp CAPS  &kp PG_DN  &kp LPAR    &kp RPAR  &kp KP_N1  &kp KP_N2  &kp KP_N3  &kp KP_MULTIPLY  &trans
                              &trans    &trans     &trans      &mo 6     &kp KP_N0  &trans
            >;
        };

        // ─────────────────────────────
        // SYM
        // ─────────────────────────────
        sim_layer {

            display-name = "SYM";
            bindings = <
        &kp EXCL     &kp DOUBLE_QUOTES  &kp HASH   &kp DLLR        &kp PRCNT    &kp AMPERSAND  &kp SINGLE_QUOTE  &kp MINUS      &kp CARET      &kp BACKSLASH
        &kp RA(A)    &kp LEFT_ALT       &kp LCTRL  &kp LEFT_SHIFT  &trans       &kp PIPE       &kp RIGHT_SHIFT   &kp RCTRL      &kp RIGHT_ALT  &kp UNDERSCORE
&trans  &kp RA(F18)  &kp RA(F19)        &trans     &trans          &trans       &trans         &trans            &kp SEMICOLON  &kp COLON      &kp BSLH        &kp AT_SIGN
                                        &trans     &trans          &mo 6        &trans         &trans            &trans
            >;
        };

        // ─────────────────────────────
        // KeyMove
        // ─────────────────────────────
        kmov_layer {

            display-name= "KeyMove";

            bindings = <
        &trans        &trans        &trans     &trans          &kp C_PREVIOUS    &kp C_VOLUME_UP    &kp HOME  &trans        &kp PAGE_UP    &trans
        &kp LEFT_WIN  &kp LEFT_ALT  &kp LCTRL  &kp LEFT_SHIFT  &kp C_PP          &kp C_VOLUME_DOWN  &kp LEFT  &kp UP_ARROW  &kp RIGHT      &trans
&trans  &trans        &trans        &trans     &trans          &kp C_NEXT        &kp K_MUTE         &kp END   &kp DOWN      &kp PAGE_DOWN  &trans  &trans
                                    &trans     &trans          &trans            &trans             &trans    &trans
            >;
        };

        // ─────────────────────────────
        // MouseMove
        // ─────────────────────────────
        mmov_layer {

            display-name= "MouseMove";
            
            bindings = <
       &none         &mkp LCLK     &mkp MCLK  &mkp RCLK   &none     &none   &mkp LCLK       &mkp MCLK       &mkp RCLK        &msc SCRL_UP
       &kp LEFT_WIN  &kp LEFT_ALT  &kp LCTRL  &kp LSHIFT  &none     &none   &mmv MOVE_LEFT  &mmv MOVE_UP    &mmv MOVE_RIGHT  &msc SCRL_DOWN
&none  &none         &none         &none      &none       &none     &none   &none           &mmv MOVE_DOWN  &msc SCRL_LEFT   &msc SCRL_RIGHT  &none
                                   &trans     &trans      &trans    &trans  &trans          &trans
            >;
        };

        // ─────────────────────────────
        // BLT
        // ─────────────────────────────
        blt_layer {
            display-name = "BlueTooth INIT";
            
            bindings = <
            &bt BT_NXT  &bt BT_SEL 0  &bt BT_SEL 1  &bt BT_SEL 2  &bt BT_SEL 3     &sys_reset  &bootloader  &studio_unlock  &trans  &trans
            &bt BT_PRV  &bt BT_SEL 4  &trans        &ind_bat      &ind_con         &trans      &trans       &trans          &trans  &trans
    &trans  &bt BT_CLR  &trans        &trans        &trans        &out OUT_TOG     &trans      &trans       &trans          &trans  &trans  &trans
                                      &trans        &trans        &trans           &trans      &trans       &trans
            >;
        };


        // ─────────────────────────────
        // ADJ
        // ─────────────────────────────
        adjust_layer {
            display-name = "ADJ";
            bindings = <
                &kp F1   &kp F2   &kp F3   &kp F4   &kp F5     &kp F6   &kp F7   &kp F8   &kp F9   &kp F12
                &kp F10  &kp F11  &none    &none    &none      &none    &none    &none    &none    &none
        &none   &none    &none    &none    &none    &none      &none    &none    &none    &none    &none
                                    &none   &none   &none      &none    &none    &none
            >;
        };
    };
};
